<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#B69ACB" />
  <meta name="description" content="Wedding RSVP for Jelai & Jhun — December 28, 2026." />
  <title>RSVP | Jelai &amp; Jhun</title>
  <style>
    :root {
      --lavender: #B69ACB;
      --deep-lavender: #80668F;
      --blush: #F7E5E8;
      --powder-blue: #DCE7F4;
      --ivory: #FFF9F2;
      --gold: #B89A72;
      --ink: #66556D;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(18px, 4vh, 42px) 16px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
      background-color: var(--ivory);
      /* Keep rsvp-background.png in the same folder as this file. */
      background-image:
        linear-gradient(rgba(255, 249, 242, 0.12), rgba(255, 249, 242, 0.12)),
        url("rsvp-background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .page {
      width: min(100%, 900px);
      margin: auto;
      padding: clamp(22px, 4vw, 38px) clamp(16px, 4vw, 34px);
      text-align: center;
      background: rgba(255, 249, 242, 0.76);
      border: 1px solid rgba(182, 154, 203, 0.34);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(87, 65, 97, 0.14);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--deep-lavender);
      font: 600 11px/1.5 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--deep-lavender);
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1.08;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #9C829D;
      font-size: clamp(1rem, 3vw, 1.2rem);
      letter-spacing: .08em;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 16px auto 12px;
      color: var(--gold);
      font-size: 21px;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: min(18vw, 90px);
      height: 1px;
      background: #CBB393;
    }

    .artwork-link {
      display: block;
      width: min(100%, 780px);
      margin: 0 auto;
      border-radius: 14px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .artwork-link:focus-visible,
    .back-button:focus-visible {
      outline: 3px solid var(--deep-lavender);
      outline-offset: 5px;
    }

    .rsvp-artwork {
      display: block;
      width: 100%;
      height: auto;
      max-height: 56vh;
      object-fit: contain;
      margin: 0 auto;
      filter: drop-shadow(0 16px 22px rgba(90, 66, 98, .20));
      transition: transform .22s ease, filter .22s ease;
    }

    .artwork-link:hover .rsvp-artwork,
    .artwork-link:focus-visible .rsvp-artwork {
      transform: translateY(-3px);
      filter: drop-shadow(0 20px 25px rgba(90, 66, 98, .24));
    }

    .hint {
      margin: 12px auto 22px;
      color: var(--deep-lavender);
      font: 13px/1.6 Arial, sans-serif;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      max-width: 100%;
      padding: 13px 24px;
      border: 1px solid rgba(128, 102, 143, .38);
      border-radius: 9px;
      background: rgba(255, 249, 242, .96);
      color: var(--deep-lavender);
      text-decoration: none;
      font: 700 12px/1.3 Arial, sans-serif;
      letter-spacing: .10em;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgba(116, 86, 127, .10);
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover { background: var(--blush); transform: translateY(-2px); }

    .footer {
      margin: 20px 0 0;
      color: #9D88A5;
      font-size: 12px;
      letter-spacing: .06em;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 10px;
        background-attachment: scroll;
      }
      .page { padding: 24px 12px; border-radius: 16px; }
      .eyebrow { font-size: 9px; letter-spacing: .18em; }
      .divider { margin: 14px auto 8px; }
      .artwork-link { width: 100%; }
      .rsvp-artwork { max-height: none; }
      .hint { font-size: 12px; margin: 8px auto 18px; }
      .back-button { width: min(100%, 300px); padding: 12px 16px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">With love, we invite you</p>
    <h1>Jelai <span aria-hidden="true">&amp;</span> Jhun</h1>
    <p class="subtitle">December 28, 2026</p>
    <div class="divider" aria-hidden="true">♡</div>

    <!-- Upload rsvp-envelope.png beside this file. The artwork itself is the clickable RSVP link. -->
    <a
      class="artwork-link"
      href="https://docs.google.com/forms/d/e/1FAIpQLSeAahU2gCnpLh_Pgj14OoY3mp2a0TqLQOLt-oy4JhUUx2umDw/viewform"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open the Jelai and Jhun wedding RSVP form"
    >
      <img
        class="rsvp-artwork"
        src="rsvp-envelope.png"
        alt="Pastel floral wedding envelope beside the Wedding RSVP card for Jelai and Jhun"
      />
    </a>

    <p class="hint">Tap the envelope and RSVP card to open our form.</p>
    <a class="back-button" href="index.html">Back to Home Page</a>
    <p class="footer">A day of love · A lifetime together</p>
  </main>
</body>
</html>
