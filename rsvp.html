<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#B69ACB" />
  <title>RSVP | Jelai &amp; Jhun</title>
  <style>
    :root {
      --lavender: #B69ACB;
      --deep-lavender: #80668F;
      --blush: #F7E5E8;
      --powder-blue: #DCE7F4;
      --ivory: #FFF9F2;
      --gold: #B89A72;
      --ink: #66556D;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 18px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
      background-color: var(--ivory);
      /* Keep rsvp-background.png in the same folder as this HTML file. */
      background-image:
        linear-gradient(rgba(255, 249, 242, 0.20), rgba(255, 249, 242, 0.20)),
        url("rsvp-background.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    .page {
      position: relative;
      width: min(100%, 720px);
      margin: auto;
      padding: clamp(24px, 5vw, 44px) clamp(16px, 4vw, 36px);
      text-align: center;
      background: rgba(255, 249, 242, 0.82);
      border: 1px solid rgba(182, 154, 203, 0.30);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(87, 65, 97, 0.13);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--deep-lavender);
      font: 600 12px/1.5 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--deep-lavender);
      font-size: clamp(2.35rem, 8vw, 4.5rem);
      font-weight: 400;
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 0;
      color: #9C829D;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      letter-spacing: .08em;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 20px auto 26px;
      color: var(--gold);
      font-size: 22px;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: min(20vw, 100px);
      height: 1px;
      background: #CBB393;
    }

    .envelope-wrap {
      width: min(100%, 500px);
      margin: 0 auto 22px;
      padding: 24px 12px 12px;
    }

    /* Important: display:block lets the anchor respect its width and aspect ratio. */
    .envelope {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1.48 / 1;
      margin: 0 auto;
      text-decoration: none;
      isolation: isolate;
      filter: drop-shadow(0 18px 22px rgba(107, 81, 112, .18));
      transition: transform .25s ease, filter .25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .envelope:hover,
    .envelope:focus-visible {
      transform: translateY(-3px);
      filter: drop-shadow(0 22px 25px rgba(107, 81, 112, .22));
    }

    .envelope:focus-visible,
    .back-button:focus-visible { outline: 3px solid var(--deep-lavender); outline-offset: 5px; }

    .env-back {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #F4EAF5, #E8DDF0 55%, #E1E8F4);
      border: 1px solid rgba(128,102,143,.28);
      z-index: 0;
    }

    .env-paper {
      position: absolute;
      z-index: 1;
      left: 9%;
      right: 9%;
      top: -8%;
      height: 77%;
      border-radius: 8px 8px 3px 3px;
      background: var(--ivory);
      border: 1px solid #E7D9E7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 16px 12px 36px;
      overflow: hidden;
    }

    .paper-small {
      color: #A68DB1;
      font: 600 clamp(8px, 2vw, 11px)/1.4 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .paper-names {
      color: var(--deep-lavender);
      font-size: clamp(1.15rem, 4.2vw, 1.8rem);
      line-height: 1.2;
    }

    .paper-date {
      max-width: 100%;
      color: #A88F77;
      font: 600 clamp(8px, 2vw, 11px)/1.5 Arial, sans-serif;
      letter-spacing: .08em;
      text-align: center;
    }

    .env-left,
    .env-right,
    .env-bottom {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      pointer-events: none;
    }

    .env-left {
      z-index: 2;
      background: linear-gradient(35deg, #E6D9EC 0%, #F6E8EF 100%);
      clip-path: polygon(0 0, 50% 55%, 0 100%);
    }

    .env-right {
      z-index: 2;
      background: linear-gradient(325deg, #DCE7F4 0%, #F4E8F0 100%);
      clip-path: polygon(100% 0, 50% 55%, 100% 100%);
    }

    .env-bottom {
      z-index: 3;
      background: linear-gradient(180deg, #F6EAF1, #E6D9EC);
      clip-path: polygon(0 100%, 50% 43%, 100% 100%);
    }

    .wax-seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 56%;
      transform: translate(-50%, -50%);
      width: clamp(48px, 12vw, 62px);
      height: clamp(48px, 12vw, 62px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #E8D2E9, #B69ACB 72%);
      border: 2px solid rgba(255,255,255,.78);
      box-shadow: 0 3px 9px rgba(95,69,109,.22);
      color: white;
      font-size: clamp(21px, 5vw, 27px);
      line-height: 1;
      pointer-events: none;
    }

    .click-label {
      position: absolute;
      z-index: 6;
      left: 50%;
      top: 8%;
      transform: translateX(-50%);
      display: block;
      width: max-content;
      max-width: calc(100% - 28px);
      padding: 11px 20px;
      border-radius: 8px;
      background: var(--deep-lavender);
      color: #fffaf8;
      font: 700 clamp(11px, 2.6vw, 14px)/1.35 Arial, sans-serif;
      letter-spacing: .07em;
      text-align: center;
      white-space: normal;
      overflow-wrap: normal;
      box-shadow: 0 5px 12px rgba(84,63,96,.18);
      pointer-events: none;
    }

    .hint {
      margin: 0 auto 24px;
      color: #80668F;
      font: 14px/1.6 Arial, sans-serif;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      max-width: 100%;
      padding: 13px 24px;
      border: 1px solid rgba(128,102,143,.35);
      border-radius: 9px;
      background: rgba(255,249,242,.94);
      color: var(--deep-lavender);
      text-decoration: none;
      font: 700 12px/1.3 Arial, sans-serif;
      letter-spacing: .10em;
      text-transform: uppercase;
      box-shadow: 0 6px 18px rgba(116,86,127,.10);
      transition: background .2s ease, transform .2s ease;
    }

    .back-button:hover { background: var(--blush); transform: translateY(-2px); }

    .footer {
      margin: 24px 0 0;
      color: #9D88A5;
      font-size: 12px;
      letter-spacing: .06em;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 12px;
        background-attachment: scroll;
      }
      .page { padding: 28px 14px; border-radius: 16px; }
      .eyebrow { font-size: 10px; letter-spacing: .18em; }
      .divider { margin: 17px auto 20px; }
      .envelope-wrap { padding: 20px 5px 8px; margin-bottom: 18px; }
      .env-paper { padding: 10px 6px 28px; gap: 5px; }
      .click-label { top: 7%; padding: 9px 12px; letter-spacing: .045em; }
      .hint { font-size: 12px; margin-bottom: 20px; }
      .back-button { padding: 12px 16px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">With love, we invite you</p>
    <h1>Jelai <span aria-hidden="true">&amp;</span> Jhun</h1>
    <p class="subtitle">December 28, 2026</p>
    <div class="divider" aria-hidden="true">♡</div>

    <div class="envelope-wrap">
      <a
        class="envelope"
        href="https://docs.google.com/forms/d/e/1FAIpQLSeAahU2gCnpLh_Pgj14OoY3mp2a0TqLQOLt-oy4JhUUx2umDw/viewform"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Click here to open the wedding RSVP form"
      >
        <span class="env-back" aria-hidden="true"></span>
        <span class="env-paper" aria-hidden="true">
          <span class="paper-small">The pleasure of your reply</span>
          <span class="paper-names">Jelai &amp; Jhun</span>
          <span class="paper-date">PLEASE RSVP BY NOVEMBER 25, 2026</span>
        </span>
        <span class="env-left" aria-hidden="true"></span>
        <span class="env-right" aria-hidden="true"></span>
        <span class="env-bottom" aria-hidden="true"></span>
        <span class="click-label">CLICK HERE TO RSVP</span>
        <span class="wax-seal" aria-hidden="true">♡</span>
      </a>
    </div>

    <p class="hint">Tap the envelope to open our RSVP form.</p>
    <a class="back-button" href="index.html">Back to Home Page</a>
    <p class="footer">A day of love · A lifetime together</p>
  </main>
</body>
</html>
