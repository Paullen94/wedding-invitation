<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#B69ACB" />
  <title>RSVP | Jelai & Jhun</title>
  <style>
    :root {
      --lavender: #B69ACB;
      --deep-lavender: #80668F;
      --blush: #F7E5E8;
      --powder-blue: #DCE7F4;
      --ivory: #FFF9F2;
      --gold: #B89A72;
      --ink: #66556D;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 15%, rgba(247,229,232,.95), transparent 35%),
        radial-gradient(ellipse at 90% 85%, rgba(220,231,244,.9), transparent 36%),
        linear-gradient(135deg, #FFF9F2 0%, #F9EFF4 48%, #F2EDF8 100%);
      font-family: Georgia, 'Times New Roman', serif;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 240px; height: 240px; border-radius: 50%;
      filter: blur(45px); opacity: .34; pointer-events: none; z-index: 0;
    }
    body::before { top: -100px; left: -90px; background: #D8C6E6; }
    body::after { right: -100px; bottom: -110px; background: #F1C9D2; }
    .page { position: relative; z-index: 1; width: min(100%, 760px); text-align: center; }
    .eyebrow { margin: 0 0 10px; color: var(--deep-lavender); font: 600 12px/1.5 Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.25rem, 7vw, 4.4rem); font-weight: 400; line-height: 1.08; color: #80668F; }
    .subtitle { margin: 12px 0 28px; font-size: clamp(1rem, 3vw, 1.2rem); letter-spacing: .08em; color: #9C829D; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0 auto 28px; color: var(--gold); }
    .divider::before, .divider::after { content: ""; height: 1px; width: 72px; background: #CBB393; }
    .envelope-wrap { width: min(100%, 520px); margin: 0 auto 30px; padding: 14px; }
    .envelope {
      position: relative; width: 100%; aspect-ratio: 1.48 / 1; max-height: 340px;
      margin: auto; filter: drop-shadow(0 18px 22px rgba(107, 81, 112, .16));
      cursor: pointer; transition: transform .25s ease, filter .25s ease;
    }
    .envelope:hover { transform: translateY(-4px); filter: drop-shadow(0 22px 25px rgba(107, 81, 112, .2)); }
    .env-back { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(135deg, #F4EAF5, #E8DDF0 55%, #E1E8F4); border: 1px solid rgba(128,102,143,.22); }
    .env-paper { position: absolute; left: 9%; right: 9%; top: -7%; height: 74%; border-radius: 8px 8px 2px 2px; background: var(--ivory); border: 1px solid #E7D9E7; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; }
    .paper-small { font: 11px Arial, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #A68DB1; }
    .paper-names { margin: 9px 0 5px; color: #80668F; font-size: clamp(1.15rem, 4vw, 1.8rem); }
    .paper-date { color: #A88F77; font-size: .92rem; letter-spacing: .09em; }
    .env-left, .env-right { position: absolute; inset: 0; border-radius: 12px; }
    .env-left { background: linear-gradient(35deg, #E6D9EC 0%, #F6E8EF 100%); clip-path: polygon(0 0, 50% 53%, 0 100%); }
    .env-right { background: linear-gradient(325deg, #DCE7F4 0%, #F4E8F0 100%); clip-path: polygon(100% 0, 50% 53%, 100% 100%); }
    .env-bottom { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(180deg, #F6EAF1, #E6D9EC); clip-path: polygon(0 100%, 50% 44%, 100% 100%); }
    .wax-seal { position: absolute; z-index: 3; left: 50%; top: 53%; transform: translate(-50%, -50%); width: 62px; height: 62px; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #E8D2E9, #B69ACB 72%); border: 2px solid rgba(255,255,255,.68); box-shadow: 0 3px 9px rgba(95,69,109,.2); color: white; font-size: 26px; }
    .click-label { position: absolute; z-index: 4; left: 50%; top: 8%; transform: translateX(-50%); width: max-content; max-width: 88%; padding: 12px 22px; border-radius: 8px; background: #80668F; color: #fffaf8; font: 600 clamp(.85rem, 2.8vw, 1.1rem)/1.3 Arial, sans-serif; letter-spacing: .06em; box-shadow: 0 5px 12px rgba(84,63,96,.16); }
    .hint { margin: -4px 0 24px; font: 13px/1.6 Arial, sans-serif; color: #917F99; }
    .back-button { display: inline-block; padding: 13px 25px; border: 1px solid rgba(128,102,143,.28); border-radius: 8px; background: rgba(255,249,242,.78); color: #80668F; text-decoration: none; font: 600 13px/1.2 Arial, sans-serif; letter-spacing: .11em; text-transform: uppercase; box-shadow: 0 6px 18px rgba(116,86,127,.08); transition: background .2s ease, transform .2s ease; }
    .back-button:hover { background: #F7E5E8; transform: translateY(-2px); }
    .footer { margin: 28px 0 0; font-size: 12px; color: #AD9BB2; letter-spacing: .08em; }
    @media (max-width: 480px) {
      body { padding: 26px 14px; }
      .envelope-wrap { padding: 10px 4px; margin-bottom: 22px; }
      .wax-seal { width: 48px; height: 48px; font-size: 21px; }
      .click-label { padding: 10px 15px; }
      .env-paper { padding: 12px 8px; }
      .paper-small { font-size: 9px; }
      .paper-date { font-size: .76rem; }
      .back-button { padding: 12px 18px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">With love, we invite you</p>
    <h1>Jelai <span aria-hidden="true">&amp;</span> Jhun</h1>
    <p class="subtitle">December 28, 2026</p>
    <div class="divider" aria-hidden="true">♡</div>

    <div class="envelope-wrap">
      <a class="envelope" href="https://docs.google.com/forms/d/e/1FAIpQLSeAahU2gCnpLh_Pgj14OoY3mp2a0TqLQOLt-oy4JhUUx2umDw/viewform" target="_blank" rel="noopener noreferrer" aria-label="Open the wedding RSVP form">
        <span class="env-back"></span>
        <span class="env-paper">
          <span class="paper-small">The pleasure of your reply</span>
          <span class="paper-names">Jelai &amp; Jhun</span>
          <span class="paper-date">PLEASE RSVP BY NOVEMBER 25, 2026</span>
        </span>
        <span class="env-left"></span><span class="env-right"></span><span class="env-bottom"></span>
        <span class="click-label">CLICK HERE TO RSVP</span>
        <span class="wax-seal" aria-hidden="true">♡</span>
      </a>
    </div>
    <p class="hint">Tap the envelope to open our RSVP form.</p>
    <a class="back-button" href="index.html">Back to Home Page</a>
    <p class="footer">A day of love · A lifetime together</p>
  </main>
</body>
</html>
